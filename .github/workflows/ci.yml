name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer, phpcs, phpunit

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test
